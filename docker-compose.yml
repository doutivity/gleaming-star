services:
  mission-control:
    build:
      context: .
      target: runtime
    ports:
      - "8000:8000"
    environment:
      PORT: "8000"
      SHIP_NAME: "ISV GLEAMING STAR"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8000/health"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  test:
    build:
      context: .
      target: test
    profiles: ["test"]
